name: DEBUG NRFI RUN

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - run: |
          echo "===== LISTING FILES ====="
          ls -R

      - run: |
          echo "===== RUNNING PYTHON FILES ====="
          python --version

      - run: |
          echo "===== SEARCHING FOR PREDICT FILES ====="
          find . -name "*.py"

      - run: |
          echo "===== EXECUTING CURRENT SCRIPT ====="
          python src/predictor.py || python src/predictor_v2.py || python src/predict_all.py