name: Daily NRFI Run

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        run: python src/predict_all.py

      - name: Commit results
        run: |
          git config --global user.name "nrfi-bot"
          git config --global user.email "nrfi-bot@users.noreply.github.com"
          git add data/
          git commit -m "update predictions" || echo "no changes"
          git push